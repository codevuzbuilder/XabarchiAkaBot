name: bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Bir vaqtda faqat bitta job. Yangi cron kelsa — navbatda kutadi.
concurrency:
  group: bot-singleton
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # API limiti 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Oxirgi DB'ni artifact'dan tiklash
      - name: Restore DB
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bot-db
          path: ./data

      - name: Ensure dirs
        run: mkdir -p ./data ./logs

      # 5.5 soat loop + watchdog. Har safar main.py to'xtasa qayta uradi.
      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          DB_PATH: ./data/bot.db
          OFFSET_PATH: ./data/offset.txt
          PREMIUM_EMOJI_ENABLED: "1"
          TEZCHECK_BASE_URL: ${{ secrets.TEZCHECK_BASE_URL }}
          TEZCHECK_SECRET: ${{ secrets.TEZCHECK_SECRET }}
          CLICK_SERVICE_ID: ${{ secrets.CLICK_SERVICE_ID }}
          CLICK_MERCHANT_ID: ${{ secrets.CLICK_MERCHANT_ID }}
          CLICK_MERCHANT_USER_ID: ${{ secrets.CLICK_MERCHANT_USER_ID }}
          CLICK_SECRET_KEY: ${{ secrets.CLICK_SECRET_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          END=$((SECONDS + 330*60))
          echo "[watchdog] start $(date -u)"
          while [ $SECONDS -lt $END ]; do
            echo "[watchdog] launching main.py at $(date -u)"
            python main.py || echo "[watchdog] exit code $? — restarting"
            echo "[watchdog] main.py stopped, sleeping 8s"
            sleep 8
          done
          echo "[watchdog] reached END at $(date -u)"

      # DB'ni har doim saqlash (fail bo'lsa ham)
      - name: Upload DB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-db
          path: ./data
          retention-days: 30
          overwrite: true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: ./logs
          retention-days: 7
          if-no-files-found: ignore